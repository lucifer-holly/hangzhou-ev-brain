      <stop offset="0" stop-color="#00D4FF"/>
      <stop offset="1" stop-color="#4A9EFF"/>
    </linearGradient>
    <radialGradient id="ring" cx="32" cy="32" r="30" gradientUnits="userSpaceOnUse">
      <stop offset="0.85" stop-color="#00D4FF" stop-opacity="0"/>
      <stop offset="1" stop-color="#00D4FF" stop-opacity="0.45"/>
    </radialGradient>
