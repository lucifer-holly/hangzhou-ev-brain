[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hzev-backend"
version = "0.1.0"
description = "HZ-EV Brain backend: FastAPI + synthetic data generator + SQLite + MQTT"
requires-python = ">=3.11"
authors = [{ name = "HZ-EV Brain" }]
dependencies = [
    "fastapi>=0.115,<0.121",
    "uvicorn[standard]>=0.30,<0.35",
    "python-multipart>=0.0.9",
    "sqlalchemy>=2.0,<2.1",
    "aiosqlite>=0.20,<0.22",
    "greenlet>=3.0,<4.0",
    "pydantic>=2.7,<3.0",
    "pydantic-settings>=2.4,<3.0",
    "apscheduler>=3.10,<4.0",
    "paho-mqtt>=2.1,<3.0",
    "numpy>=1.26,<3.0",
    "scipy>=1.13,<2.0",
    "pandas>=2.2",
    "scikit-learn>=1.4",
    "python-dateutil>=2.9,<3.0",
    # AI / models
    "torch>=2.4",
    "xgboost>=2.1",
    "shap>=0.46",
    "ultralytics>=8.2",
    "onnx>=1.17",
    "onnxruntime>=1.19",
    "Pillow>=10.0",
    "matplotlib>=3.8",
    "joblib>=1.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
    "pytest-asyncio>=0.23,<1.0",
    "httpx>=0.27,<1.0",
    "ruff>=0.5,<1.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["api*", "synth*", "db*", "ai*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]
