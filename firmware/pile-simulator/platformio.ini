; HZ-EV Brain · Pile Simulator
; PlatformIO project for ESP32-S3, runnable in Wokwi or on real hardware.

[platformio]
default_envs = esp32-s3-devkitc-1

[env:esp32-s3-devkitc-1]
platform = espressif32 @ ^6.7.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600

lib_deps =
  knolleary/PubSubClient @ ^2.8
  bblanchon/ArduinoJson @ ^7.0.4
  adafruit/Adafruit MPU6050 @ ^2.2.6
  adafruit/Adafruit Unified Sensor @ ^1.1.14
  ESP32Servo @ ^3.0.5
  ; Arduino-API TFLite Micro port (last release 2024-07).  Provides
  ; tensorflow/lite/micro/* headers — same API as upstream TFLM.
  spaziochirale/Chirale_TensorFLowLite @ ^2.0.0

build_flags =
  -DCORE_DEBUG_LEVEL=1
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DHZEV_FIRMWARE_VERSION=\"0.2.0\"
  -DHZEV_USE_TFLITE=1
  ; Size optimisations — already-built ESP-IDF/Arduino libs limit how
  ; much fat we can strip; we keep -Os + gc-sections for our own
  ; objects (-flto trips the framework's missing-LTO-plugin objects).
  -Os
  -ffunction-sections
  -fdata-sections
  -Wl,--gc-sections

build_unflags =
  -std=gnu++11
  -Og
build_src_flags =
  -std=gnu++17
