name: CI

# Two parallel jobs — backend (Python) and frontend (Node) — plus a
# lightweight contracts job that lints the OpenAPI / AsyncAPI YAMLs and
# the four operator JSON schemas.
#
# Triggers:
#   - push to main
#   - any pull request
#
# Reproducibility: all jobs install pinned dependency versions from
# pyproject.toml / pnpm-lock.yaml, so a green CI run = a fresh clone +
# the one-line install commands in CONTRIBUTING.md.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Backend · ruff + pytest
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/pyproject.toml

      - name: Install backend (with dev extras)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint with ruff
        run: ruff check .

      - name: Format check with ruff
        run: ruff format --check .

      - name: Run pytest
        env:
          # Match runtime: cap OpenMP threads so PyTorch + numpy don't
          # collide on the small CI runner.
          OMP_NUM_THREADS: "1"
          MKL_NUM_THREADS: "1"
        run: pytest -q

  frontend:
    name: Frontend · pnpm lint + build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate API types from contracts
        run: pnpm run codegen

      - name: ESLint
        run: pnpm lint

      - name: Build (tsc + vite)
        run: pnpm build

  contracts:
    name: Contracts · YAML + JSON schema sanity
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install YAML + JSON schema validators
        run: pip install pyyaml jsonschema

      - name: Verify OpenAPI + AsyncAPI parse
        run: |
          python - <<'PY'
          import yaml, sys
          for p in ("contracts/openapi.yaml", "contracts/asyncapi.yaml"):
              with open(p) as f:
                  yaml.safe_load(f)
              print(f"ok {p}")
          PY

      - name: Verify operator schemas are valid JSON Schema
        run: |
          python - <<'PY'
          import json, glob, sys
          from jsonschema import Draft202012Validator
          for p in sorted(glob.glob("contracts/operators/*.schema.json")):
              with open(p) as f:
                  schema = json.load(f)
              # Will raise if the schema itself is invalid.
              Draft202012Validator.check_schema(schema)
              print(f"ok {p}")
          PY
