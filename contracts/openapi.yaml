openapi: 3.1.0
info:
  title: HZ-EV Brain Backend
  description: HZ-EV Brain backend.  100% synthetic data, 100 piles across 杭州未来科技城 + 钱塘新区, 30-day history
    + 1 Hz live ticks.
  version: 0.1.0
paths:
  /health:
    get:
      tags:
      - health
      summary: Liveness probe
      description: 'Return ``{"status": "ok"}`` when the process is alive.'
      operationId: health_health_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
                title: Response Health Health Get
  /version:
    get:
      tags:
      - health
      summary: Version metadata
      operationId: version_version_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
                title: Response Version Version Get
  /api/piles:
    get:
      tags:
      - piles
      summary: List piles
      description: Return all piles, with optional region / operator / status filters.
      operationId: list_piles_api_piles_get
      parameters:
      - name: region
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Filter by region id.
          title: Region
        description: Filter by region id.
      - name: operator
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Filter by operator id.
          title: Operator
        description: Filter by operator id.
      - name: status
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Filter by current_status.
          title: Status
        description: Filter by current_status.
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PileOut'
                title: Response List Piles Api Piles Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/piles/{pile_id}:
    get:
      tags:
      - piles
      summary: Pile detail
      description: Return a single pile with its 24-hour rolling summary.
      operationId: get_pile_api_piles__pile_id__get
      parameters:
      - name: pile_id
        in: path
        required: true
        schema:
          type: string
          title: Pile Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PileDetail'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/piles/{pile_id}/telemetry:
    get:
      tags:
      - piles
      summary: Pile telemetry (history)
      description: Return historical telemetry for a single pile, newest first.
      operationId: get_telemetry_api_piles__pile_id__telemetry_get
      parameters:
      - name: pile_id
        in: path
        required: true
        schema:
          type: string
          title: Pile Id
      - name: from
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: From
      - name: to
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: To
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 10000
          minimum: 1
          default: 500
          title: Limit
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TelemetryPoint'
                title: Response Get Telemetry Api Piles  Pile Id  Telemetry Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/operators:
    get:
      tags:
      - operators
      summary: List operators
      description: Return all operators with their pile counts.
      operationId: list_operators_api_operators_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/OperatorOut'
                type: array
                title: Response List Operators Api Operators Get
  /api/regions:
    get:
      tags:
      - regions
      summary: List regions
      operationId: list_regions_api_regions_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/RegionOut'
                type: array
                title: Response List Regions Api Regions Get
  /api/events:
    get:
      tags:
      - events
      summary: List events
      operationId: list_events_api_events_get
      parameters:
      - name: type
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Filter by event type.
          title: Type
        description: Filter by event type.
      - name: severity
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Filter by severity.
          title: Severity
        description: Filter by severity.
      - name: pile_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Filter by pile id.
          title: Pile Id
        description: Filter by pile id.
      - name: since
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          description: Only events on/after this UTC ts.
          title: Since
        description: Only events on/after this UTC ts.
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 2000
          minimum: 1
          default: 100
          title: Limit
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/EventOut'
                title: Response List Events Api Events Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/stats/utilization-24h:
    get:
      tags:
      - stats
      summary: Citywide hourly utilization for the last 24 hours
      description: 'Return 24 hourly buckets of average occupancy across all piles.


        Used by the IOC homepage bottom-strip line chart. Each bucket is an

        hour-of-day (0-23 UTC); the value is the mean occupancy across all

        telemetry rows in the last 24h that fell into that hour.'
      operationId: utilization_24h_api_stats_utilization_24h_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Utilization24hResponse'
  /api/stats/fault-types:
    get:
      tags:
      - stats
      summary: Fault-type distribution over a recent window
      description: 'Return event counts grouped by type (fault categories only).


        Charging start/end and communication-loss are excluded; we want the

        "what''s actually breaking" view for the bottom-strip donut chart.'
      operationId: fault_types_api_stats_fault_types_get
      parameters:
      - name: hours
        in: query
        required: false
        schema:
          type: integer
          maximum: 168
          minimum: 1
          default: 24
          title: Hours
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FaultTypesResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/stats/predicted-utilization:
    get:
      tags:
      - stats
      summary: One-shot LSTM forecast across every pile
      description: 'Return the next-hour predicted occupancy for every pile.


        Loads the 30-day telemetry DataFrame ONCE and predicts the whole

        population in a single batched LSTM forward pass — drastically

        faster than calling ``/api/ai/predict/demand`` 100 times.

        Result cached in-process for 60 s.'
      operationId: predicted_utilization_api_stats_predicted_utilization_get
      parameters:
      - name: hours_ahead
        in: query
        required: false
        schema:
          type: integer
          maximum: 6
          minimum: 1
          default: 1
          title: Hours Ahead
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PredictedUtilizationResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/ai/predict/demand:
    post:
      tags:
      - AI
      summary: LSTM demand prediction
      operationId: predict_demand_api_ai_predict_demand_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DemandRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DemandResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/ai/predict/site:
    post:
      tags:
      - AI
      summary: XGBoost + SHAP site selection
      operationId: predict_site_api_ai_predict_site_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SiteFeatures'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SiteResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/ai/anomaly/{pile_id}:
    get:
      tags:
      - AI
      summary: Autoencoder anomaly check
      operationId: check_anomaly_api_ai_anomaly__pile_id__get
      parameters:
      - name: pile_id
        in: path
        required: true
        schema:
          type: string
          title: Pile Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnomalyResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/ai/yolo/detect:
    post:
      tags:
      - AI
      summary: YOLOv8 occupancy detection
      operationId: yolo_detect_api_ai_yolo_detect_post
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Body_yolo_detect_api_ai_yolo_detect_post'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/YoloResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/stats/operator-compliance:
    get:
      tags:
      - stats
      summary: 4-operator compliance scorecard with composite rating
      operationId: operator_compliance_api_stats_operator_compliance_get
      parameters:
      - name: window
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/ComplianceWindow'
          default: 24h
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperatorComplianceResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
components:
  schemas:
    AnomalyResponse:
      properties:
        pile_id:
          type: string
          title: Pile Id
        is_anomaly:
          type: boolean
          title: Is Anomaly
        reconstruction_error:
          type: number
          minimum: 0.0
          title: Reconstruction Error
        threshold:
          type: number
          minimum: 0.0
          title: Threshold
        margin_ratio:
          type: number
          title: Margin Ratio
      type: object
      required:
      - pile_id
      - is_anomaly
      - reconstruction_error
      - threshold
      - margin_ratio
      title: AnomalyResponse
    Body_yolo_detect_api_ai_yolo_detect_post:
      properties:
        image:
          type: string
          format: binary
          title: Image
          description: JPEG / PNG image of a parking area.
      type: object
      required:
      - image
      title: Body_yolo_detect_api_ai_yolo_detect_post
    ComplianceWindow:
      type: string
      enum:
      - 24h
      - 7d
      - 30d
      title: ComplianceWindow
    DemandRequest:
      properties:
        pile_id:
          type: string
          title: Pile Id
          description: Pile id (must exist in the DB).
        hours_ahead:
          type: integer
          maximum: 24.0
          minimum: 1.0
          title: Hours Ahead
          description: Forecast horizon in hours.
          default: 1
      type: object
      required:
      - pile_id
      title: DemandRequest
    DemandResponse:
      properties:
        pile_id:
          type: string
          title: Pile Id
        hours_ahead:
          type: integer
          title: Hours Ahead
        predicted_occupancy:
          type: number
          maximum: 1.0
          minimum: 0.0
          title: Predicted Occupancy
        std:
          type: number
          minimum: 0.0
          title: Std
        ci_low:
          type: number
          maximum: 1.0
          minimum: 0.0
          title: Ci Low
        ci_high:
          type: number
          maximum: 1.0
          minimum: 0.0
          title: Ci High
      type: object
      required:
      - pile_id
      - hours_ahead
      - predicted_occupancy
      - std
      - ci_low
      - ci_high
      title: DemandResponse
    EventOut:
      properties:
        id:
          type: integer
          title: Id
        pile_id:
          type: string
          title: Pile Id
        ts:
          type: string
          format: date-time
          title: Ts
        type:
          type: string
          enum:
          - voltage_anomaly
          - thermal_fault
          - vibration_event
          - cable_fault
          - communication_loss
          - charging_start
          - charging_end
          title: Type
        severity:
          type: string
          enum:
          - info
          - warning
          - critical
          title: Severity
        message:
          type: string
          title: Message
        duration_minutes:
          type: number
          title: Duration Minutes
        resolved:
          type: boolean
          title: Resolved
      type: object
      required:
      - id
      - pile_id
      - ts
      - type
      - severity
      - message
      - duration_minutes
      - resolved
      title: EventOut
    FaultTypeBucket:
      properties:
        type:
          type: string
          title: Type
        count:
          type: integer
          minimum: 0.0
          title: Count
        severity_breakdown:
          additionalProperties:
            type: integer
          type: object
          title: Severity Breakdown
      type: object
      required:
      - type
      - count
      - severity_breakdown
      title: FaultTypeBucket
    FaultTypesResponse:
      properties:
        generated_at:
          type: string
          format: date-time
          title: Generated At
        window_hours:
          type: integer
          title: Window Hours
        total:
          type: integer
          title: Total
        buckets:
          items:
            $ref: '#/components/schemas/FaultTypeBucket'
          type: array
          title: Buckets
      type: object
      required:
      - generated_at
      - window_hours
      - total
      - buckets
      title: FaultTypesResponse
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    HourlyOccupancy:
      properties:
        hour:
          type: integer
          maximum: 23.0
          minimum: 0.0
          title: Hour
          description: Hour of day, 0-23 in UTC.
        avg_occupancy:
          type: number
          maximum: 1.0
          minimum: 0.0
          title: Avg Occupancy
        sample_count:
          type: integer
          minimum: 0.0
          title: Sample Count
      type: object
      required:
      - hour
      - avg_occupancy
      - sample_count
      title: HourlyOccupancy
    OperatorComplianceResponse:
      properties:
        generated_at:
          type: string
          format: date-time
          title: Generated At
        window:
          $ref: '#/components/schemas/ComplianceWindow'
        rows:
          type: array
          items:
            $ref: '#/components/schemas/OperatorComplianceRow'
          title: Rows
      type: object
      required:
      - generated_at
      - window
      - rows
      title: OperatorComplianceResponse
    OperatorComplianceRow:
      properties:
        operator_id:
          type: string
          title: Operator Id
        operator_name:
          type: string
          title: Operator Name
        color:
          type: string
          title: Color
        pile_count:
          type: integer
          title: Pile Count
        availability_rate:
          type: number
          maximum: 1.0
          minimum: 0.0
          title: Availability Rate
        mttr_minutes:
          type: number
          minimum: 0.0
          title: Mttr Minutes
        price_anomaly_count:
          type: integer
          minimum: 0
          title: Price Anomaly Count
        complaint_count:
          type: integer
          minimum: 0
          title: Complaint Count
        composite_score:
          type: number
          maximum: 100.0
          minimum: 0.0
          title: Composite Score
        rating:
          type: string
          enum:
          - A
          - B
          - C
          - D
          title: Rating
      type: object
      required:
      - operator_id
      - operator_name
      - color
      - pile_count
      - availability_rate
      - mttr_minutes
      - price_anomaly_count
      - complaint_count
      - composite_score
      - rating
      title: OperatorComplianceRow
    OperatorOut:
      properties:
        id:
          type: string
          title: Id
          description: Operator slug, e.g. 'state_grid'.
        name_zh:
          type: string
          title: Name Zh
        name_en:
          type: string
          title: Name En
        market_share:
          type: number
          maximum: 1.0
          minimum: 0.0
          title: Market Share
        color:
          type: string
          title: Color
        pile_count:
          anyOf:
          - type: integer
          - type: 'null'
          title: Pile Count
          description: Number of piles owned.
      type: object
      required:
      - id
      - name_zh
      - name_en
      - market_share
      - color
      title: OperatorOut
    PileDetail:
      properties:
        id:
          type: string
          title: Id
        operator_id:
          type: string
          title: Operator Id
        region_id:
          type: string
          title: Region Id
        lat:
          type: number
          title: Lat
        lng:
          type: number
          title: Lng
        capacity_kw:
          type: number
          title: Capacity Kw
        connector_type:
          type: string
          title: Connector Type
        installed_at:
          type: string
          format: date-time
          title: Installed At
        subsidy_amount:
          type: number
          title: Subsidy Amount
        subsidy_group:
          type: string
          enum:
          - treatment
          - control
          title: Subsidy Group
        current_status:
          type: string
          enum:
          - idle
          - charging
          - occupied
          - fault
          - offline
          title: Current Status
        current_voltage:
          type: number
          title: Current Voltage
        current_current:
          type: number
          title: Current Current
        current_power:
          type: number
          title: Current Power
        current_occupancy:
          type: number
          maximum: 1.0
          minimum: 0.0
          title: Current Occupancy
        last_seen_at:
          type: string
          format: date-time
          title: Last Seen At
        summary_24h:
          $ref: '#/components/schemas/PileSummary24h'
      type: object
      required:
      - id
      - operator_id
      - region_id
      - lat
      - lng
      - capacity_kw
      - connector_type
      - installed_at
      - subsidy_amount
      - subsidy_group
      - current_status
      - current_voltage
      - current_current
      - current_power
      - current_occupancy
      - last_seen_at
      - summary_24h
      title: PileDetail
    PileOut:
      properties:
        id:
          type: string
          title: Id
        operator_id:
          type: string
          title: Operator Id
        region_id:
          type: string
          title: Region Id
        lat:
          type: number
          title: Lat
        lng:
          type: number
          title: Lng
        capacity_kw:
          type: number
          title: Capacity Kw
        connector_type:
          type: string
          title: Connector Type
        installed_at:
          type: string
          format: date-time
          title: Installed At
        subsidy_amount:
          type: number
          title: Subsidy Amount
        subsidy_group:
          type: string
          enum:
          - treatment
          - control
          title: Subsidy Group
        current_status:
          type: string
          enum:
          - idle
          - charging
          - occupied
          - fault
          - offline
          title: Current Status
        current_voltage:
          type: number
          title: Current Voltage
        current_current:
          type: number
          title: Current Current
        current_power:
          type: number
          title: Current Power
        current_occupancy:
          type: number
          maximum: 1.0
          minimum: 0.0
          title: Current Occupancy
        last_seen_at:
          type: string
          format: date-time
          title: Last Seen At
      type: object
      required:
      - id
      - operator_id
      - region_id
      - lat
      - lng
      - capacity_kw
      - connector_type
      - installed_at
      - subsidy_amount
      - subsidy_group
      - current_status
      - current_voltage
      - current_current
      - current_power
      - current_occupancy
      - last_seen_at
      title: PileOut
    PilePrediction:
      properties:
        pile_id:
          type: string
          title: Pile Id
        predicted_occupancy:
          type: number
          maximum: 1.0
          minimum: 0.0
          title: Predicted Occupancy
        std:
          type: number
          minimum: 0.0
          title: Std
        ci_low:
          type: number
          maximum: 1.0
          minimum: 0.0
          title: Ci Low
        ci_high:
          type: number
          maximum: 1.0
          minimum: 0.0
          title: Ci High
      type: object
      required:
      - pile_id
      - predicted_occupancy
      - std
      - ci_low
      - ci_high
      title: PilePrediction
    PileSummary24h:
      properties:
        avg_occupancy:
          type: number
          maximum: 1.0
          minimum: 0.0
          title: Avg Occupancy
        peak_occupancy:
          type: number
          maximum: 1.0
          minimum: 0.0
          title: Peak Occupancy
        total_energy_kwh:
          type: number
          title: Total Energy Kwh
        fault_count:
          type: integer
          title: Fault Count
        sample_count:
          type: integer
          title: Sample Count
      type: object
      required:
      - avg_occupancy
      - peak_occupancy
      - total_energy_kwh
      - fault_count
      - sample_count
      title: PileSummary24h
    PredictedUtilizationResponse:
      properties:
        generated_at:
          type: string
          format: date-time
          title: Generated At
        hours_ahead:
          type: integer
          title: Hours Ahead
        pile_count:
          type: integer
          title: Pile Count
        average_predicted_occupancy:
          type: number
          maximum: 1.0
          minimum: 0.0
          title: Average Predicted Occupancy
        average_confidence:
          type: number
          maximum: 1.0
          minimum: 0.0
          title: Average Confidence
          description: Average half-CI-width across piles, 1 = perfectly tight, 0 = wide.
        predictions:
          items:
            $ref: '#/components/schemas/PilePrediction'
          type: array
          title: Predictions
      type: object
      required:
      - generated_at
      - hours_ahead
      - pile_count
      - average_predicted_occupancy
      - average_confidence
      - predictions
