# HZ-EV Brain — Mosquitto broker config (anonymous, demo only).
#
# Two listeners:
#   1883  — MQTT (used by Wokwi pile firmware + backend subscriber)
#   9001  — MQTT over WebSocket (used by browser-side debug tools)
#
# Anonymous access is enabled because this is a local-only demo.  Do NOT
# point this config at the public internet.

listener 1883 0.0.0.0
protocol mqtt

listener 9001 0.0.0.0
protocol websockets

allow_anonymous true

persistence true
persistence_location /mosquitto/data/

log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
connection_messages true
log_timestamp true
