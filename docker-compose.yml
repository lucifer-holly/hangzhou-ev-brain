services:
  backend:
    build: ./backend
    container_name: hz-ev-brain-backend
    ports:
      - "8000:8000"
    volumes:
      - hzev_db:/app/data
    environment:
      DATABASE_URL: sqlite+aiosqlite:////app/data/hzev.db
      SYNC_DATABASE_URL: sqlite:////app/data/hzev.db
      MQTT_BROKER: mosquitto
      MQTT_PORT: 1883
      PILE_COUNT: 100
      HISTORY_DAYS: 30
      REALTIME_TICK_SECONDS: 1.0
      RNG_SEED: 42
    depends_on:
      mosquitto:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  mosquitto:
    image: eclipse-mosquitto:2
    container_name: hz-ev-brain-mosquitto
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ./infra/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto_data:/mosquitto/data
      - mosquitto_log:/mosquitto/log
    restart: unless-stopped

  frontend:
    # NOTE: Vite is a static bundler. VITE_* env vars must be passed at *build
    # time* via build.args (docker-compose auto-reads ../.env from repo root).
    # Setting them under `environment:` would have no effect on the compiled
    # JS bundle.
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000}
        VITE_WS_URL: ${VITE_WS_URL:-ws://localhost:8000/ws}
        VITE_MAP_PROVIDER: ${VITE_MAP_PROVIDER:-osm}
        VITE_AMAP_KEY: ${VITE_AMAP_KEY:-}
        VITE_AMAP_SECURITY_KEY: ${VITE_AMAP_SECURITY_KEY:-}
        VITE_GITHUB_URL: ${VITE_GITHUB_URL:-https://github.com/your-username/hz-ev-brain}
    container_name: hz-ev-brain-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  hzev_db:
  mosquitto_data:
  mosquitto_log:
